<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <linearGradient id="editorBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .font-base { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>

  <rect width="1000" height="620" fill="url(#editorBg)" />

  <!-- Window Container -->
  <g transform="translate(40, 25)" filter="url(#boxShadow)">
    <rect width="920" height="570" rx="16" fill="#131b2e" stroke="#1f2937" stroke-width="1.5" />

    <!-- Top Title -->
    <g transform="translate(30, 25)">
      <text x="0" y="20" class="font-base" font-size="20" font-weight="800" fill="#ffffff">🎨 Suite de Edición, Efectos Pro y Aspect Ratios</text>
      <text x="0" y="42" class="font-base" font-size="13" fill="#94a3b8">Personalización completa antes de exportar: filtros fotográficos, sombras multicapa, stickers y formatos de redes.</text>
    </g>

    <!-- 3 Columns of Features -->

    <!-- Column 1: Fondos & Aspect Ratios (x: 30) -->
    <g transform="translate(30, 85)">
      <rect width="275" height="455" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      
      <g transform="translate(18, 20)">
        <text x="0" y="14" class="font-base" font-size="14" font-weight="700" fill="#f8fafc">1. Fondos &amp; Proporciones</text>
        <line x1="0" y1="26" x2="238" y2="26" stroke="#334155" stroke-width="1" />

        <!-- Aspect Ratios -->
        <text x="0" y="48" class="font-base" font-size="11" font-weight="600" fill="#94a3b8">ASPECT RATIOS (REDES SOCIALES)</text>
        <g transform="translate(0, 58)">
          <rect x="0" y="0" width="54" height="32" rx="6" fill="#334155" stroke="#6366f1" stroke-width="1.5" />
          <text x="14" y="20" class="font-base" font-size="11" font-weight="700" fill="#818cf8">1:1</text>

          <rect x="60" y="0" width="54" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
          <text x="70" y="20" class="font-base" font-size="11" fill="#cbd5e1">9:16</text>

          <rect x="120" y="0" width="54" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
          <text x="130" y="20" class="font-base" font-size="11" fill="#cbd5e1">16:9</text>

          <rect x="180" y="0" width="54" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
          <text x="192" y="20" class="font-base" font-size="11" fill="#cbd5e1">4:5</text>
        </g>

        <!-- Transform Buttons -->
        <text x="0" y="115" class="font-base" font-size="11" font-weight="600" fill="#94a3b8">TRANSFORMACIONES</text>
        <g transform="translate(0, 125)">
          <rect x="0" y="0" width="75" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
          <text x="10" y="19" class="font-base" font-size="10" fill="#cbd5e1">⇄ Espejo H</text>

          <rect x="82" y="0" width="75" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
          <text x="92" y="19" class="font-base" font-size="10" fill="#cbd5e1">⇅ Espejo V</text>

          <rect x="164" y="0" width="74" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
          <text x="175" y="19" class="font-base" font-size="10" fill="#cbd5e1">↻ Girar 90°</text>
        </g>

        <!-- Solid & Gradient Backgrounds -->
        <text x="0" y="180" class="font-base" font-size="11" font-weight="600" fill="#94a3b8">COLORES &amp; GRADIENTES</text>
        <g transform="translate(0, 192)">
          <circle cx="16" cy="16" r="14" fill="#ffffff" stroke="#6366f1" stroke-width="2" />
          <circle cx="52" cy="16" r="14" fill="#000000" />
          <circle cx="88" cy="16" r="14" fill="#6366f1" />
          <circle cx="124" cy="16" r="14" fill="#ec4899" />
          <circle cx="160" cy="16" r="14" fill="#10b981" />
          <circle cx="196" cy="16" r="14" fill="#f59e0b" />
        </g>

        <!-- Custom Background Image with Blur -->
        <text x="0" y="245" class="font-base" font-size="11" font-weight="600" fill="#94a3b8">FONDO PERSONALIZADO CON DESENFOQUE</text>
        <g transform="translate(0, 255)">
          <rect width="238" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
          <text x="12" y="22" class="font-base" font-size="11" fill="#38bdf8">🖼 Cargar imagen de fondo...</text>
          
          <text x="0" y="55" class="font-base" font-size="11" fill="#94a3b8">Desenfoque (Blur): 12px</text>
          <rect x="0" y="65" width="238" height="5" rx="2.5" fill="#0f172a" />
          <rect x="0" y="65" width="100" height="5" rx="2.5" fill="#6366f1" />
          <circle cx="100" cy="67.5" r="7" fill="#ffffff" />
        </g>

        <!-- Batch Propagation Button -->
        <g transform="translate(0, 365)">
          <rect width="238" height="36" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
          <text x="25" y="23" class="font-base" font-size="12" font-weight="700" fill="#a5b4fc">⚡ Aplicar estilo a todo el lote</text>
        </g>
      </g>
    </g>

    <!-- Column 2: Efectos Pro (Sticker + 3D Shadow) (x: 322) -->
    <g transform="translate(322, 85)">
      <rect width="275" height="455" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      
      <g transform="translate(18, 20)">
        <text x="0" y="14" class="font-base" font-size="14" font-weight="700" fill="#f8fafc">2. Efectos Pro (Sticker &amp; Sombra)</text>
        <line x1="0" y1="26" x2="238" y2="26" stroke="#334155" stroke-width="1" />

        <!-- Sticker Effect -->
        <g transform="translate(0, 42)">
          <text x="0" y="10" class="font-base" font-size="12" font-weight="700" fill="#ffffff">Borde Pegatina (Sticker)</text>
          <text x="0" y="28" class="font-base" font-size="11" fill="#94a3b8">Contorno exterior estilo calcomanía</text>

          <g transform="translate(0, 38)">
            <rect width="238" height="32" rx="6" fill="#0f172a" />
            <text x="12" y="21" class="font-base" font-size="11" fill="#e2e8f0">Grosor de borde: 8px</text>
            <circle cx="215" cy="16" r="10" fill="#ffffff" stroke="#6366f1" stroke-width="2" />
          </g>
        </g>

        <!-- 3D Soft Drop Shadow -->
        <g transform="translate(0, 145)">
          <text x="0" y="10" class="font-base" font-size="12" font-weight="700" fill="#ffffff">Sombra Suave 3D</text>
          <text x="0" y="28" class="font-base" font-size="11" fill="#94a3b8">Oclusión de contacto realista</text>

          <!-- Shadow Blur Slider -->
          <g transform="translate(0, 40)">
            <text x="0" y="10" class="font-base" font-size="11" fill="#cbd5e1">Difuminado (Blur)</text>
            <text x="210" y="10" class="font-base" font-size="11" fill="#818cf8">24px</text>
            <rect x="0" y="16" width="238" height="5" rx="2.5" fill="#0f172a" />
            <rect x="0" y="16" width="140" height="5" rx="2.5" fill="#6366f1" />
            <circle cx="140" cy="18.5" r="6" fill="#ffffff" />
          </g>

          <!-- Shadow Offset Slider -->
          <g transform="translate(0, 85)">
            <text x="0" y="10" class="font-base" font-size="11" fill="#cbd5e1">Desplazamiento Y</text>
            <text x="210" y="10" class="font-base" font-size="11" fill="#818cf8">16px</text>
            <rect x="0" y="16" width="238" height="5" rx="2.5" fill="#0f172a" />
            <rect x="0" y="16" width="100" height="5" rx="2.5" fill="#6366f1" />
            <circle cx="100" cy="18.5" r="6" fill="#ffffff" />
          </g>

          <!-- Shadow Opacity Slider -->
          <g transform="translate(0, 130)">
            <text x="0" y="10" class="font-base" font-size="11" fill="#cbd5e1">Opacidad de sombra</text>
            <text x="210" y="10" class="font-base" font-size="11" fill="#818cf8">55%</text>
            <rect x="0" y="16" width="238" height="5" rx="2.5" fill="#0f172a" />
            <rect x="0" y="16" width="130" height="5" rx="2.5" fill="#6366f1" />
            <circle cx="130" cy="18.5" r="6" fill="#ffffff" />
          </g>
        </g>
      </g>
    </g>

    <!-- Column 3: Ajustes Fotográficos & Exportación (x: 614) -->
    <g transform="translate(614, 85)">
      <rect width="275" height="455" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      
      <g transform="translate(18, 20)">
        <text x="0" y="14" class="font-base" font-size="14" font-weight="700" fill="#f8fafc">3. Filtros &amp; Exportación</text>
        <line x1="0" y1="26" x2="238" y2="26" stroke="#334155" stroke-width="1" />

        <!-- Brightness / Contrast / Saturation -->
        <g transform="translate(0, 42)">
          <!-- Brightness -->
          <text x="0" y="10" class="font-base" font-size="11" fill="#cbd5e1">Brillo (Brightness)</text>
          <text x="210" y="10" class="font-base" font-size="11" fill="#818cf8">105%</text>
          <rect x="0" y="16" width="238" height="5" rx="2.5" fill="#0f172a" />
          <rect x="0" y="16" width="135" height="5" rx="2.5" fill="#6366f1" />
          <circle cx="135" cy="18.5" r="6" fill="#ffffff" />

          <!-- Contrast -->
          <g transform="translate(0, 36)">
            <text x="0" y="10" class="font-base" font-size="11" fill="#cbd5e1">Contraste (Contrast)</text>
            <text x="210" y="10" class="font-base" font-size="11" fill="#818cf8">115%</text>
            <rect x="0" y="16" width="238" height="5" rx="2.5" fill="#0f172a" />
            <rect x="0" y="16" width="150" height="5" rx="2.5" fill="#6366f1" />
            <circle cx="150" cy="18.5" r="6" fill="#ffffff" />
          </g>

          <!-- Saturation -->
          <g transform="translate(0, 72)">
            <text x="0" y="10" class="font-base" font-size="11" fill="#cbd5e1">Saturación (Saturation)</text>
            <text x="210" y="10" class="font-base" font-size="11" fill="#818cf8">100%</text>
            <rect x="0" y="16" width="238" height="5" rx="2.5" fill="#0f172a" />
            <rect x="0" y="16" width="120" height="5" rx="2.5" fill="#6366f1" />
            <circle cx="120" cy="18.5" r="6" fill="#ffffff" />
          </g>
        </g>

        <!-- Export Scale & Format Options -->
        <g transform="translate(0, 160)">
          <text x="0" y="12" class="font-base" font-size="11" font-weight="600" fill="#94a3b8">OPCIONES DE EXPORTACIÓN</text>
          
          <g transform="translate(0, 22)">
            <!-- Format selector -->
            <rect x="0" y="0" width="115" height="30" rx="6" fill="#334155" stroke="#6366f1" stroke-width="1.5" />
            <text x="25" y="19" class="font-base" font-size="11" font-weight="700" fill="#818cf8">PNG (Alfa)</text>

            <rect x="123" y="0" width="115" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
            <text x="145" y="19" class="font-base" font-size="11" fill="#cbd5e1">JPEG (HD)</text>
          </g>

          <!-- Scale selector -->
          <g transform="translate(0, 62)">
            <rect x="0" y="0" width="75" height="28" rx="6" fill="#334155" stroke="#6366f1" stroke-width="1.5" />
            <text x="16" y="18" class="font-base" font-size="11" font-weight="700" fill="#818cf8">100% (1x)</text>

            <rect x="82" y="0" width="75" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
            <text x="100" y="18" class="font-base" font-size="11" fill="#cbd5e1">75%</text>

            <rect x="164" y="0" width="74" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
            <text x="182" y="18" class="font-base" font-size="11" fill="#cbd5e1">50%</text>
          </g>

          <!-- Live Estimation -->
          <g transform="translate(0, 105)">
            <rect width="238" height="36" rx="6" fill="#0f172a" />
            <text x="12" y="22" class="font-base" font-size="11" fill="#94a3b8">Estimado: <tspan fill="#34d399" font-weight="700">~1.2 MB</tspan> • 1920×1080 px</text>
          </g>
        </g>

        <!-- Fast Actions (Copy & Download) -->
        <g transform="translate(0, 320)">
          <!-- Copy to Clipboard -->
          <rect width="238" height="34" rx="8" fill="#0f172a" stroke="#374151" stroke-width="1" />
          <text x="35" y="22" class="font-base" font-size="11" font-weight="600" fill="#cbd5e1">📋 Copiar al Portapapeles</text>

          <!-- Export PNG -->
          <rect y="42" width="238" height="42" rx="10" fill="url(#accentGrad)" />
          <text x="50" y="68" class="font-base" font-size="13" font-weight="700" fill="#ffffff">💾 Guardar Imagen (HD)</text>
        </g>

      </g>
    </g>

  </g>
</svg>
