<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="purpleGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="fShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .font-base { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .node-title { font-size: 14px; font-weight: 700; fill: #ffffff; }
    .node-desc { font-size: 11px; fill: #94a3b8; }
  </style>

  <rect width="1000" height="320" fill="url(#archBg)" rx="16" />

  <g transform="translate(30, 24)">
    <text x="0" y="16" class="font-base" font-size="16" font-weight="800" fill="#ffffff">🏛️ Arquitectura 100% en el Navegador (Zero-Backend Privacy)</text>
    <text x="0" y="36" class="font-base" font-size="12" fill="#94a3b8">Ningún byte de tus imágenes sale de tu dispositivo. La inferencia de IA y el renderizado se ejecutan localmente.</text>
  </g>

  <!-- Step 1: Input & Queue -->
  <g transform="translate(40, 85)" filter="url(#fShadow)">
    <rect width="180" height="180" rx="12" fill="url(#boxGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="90" cy="45" r="24" fill="rgba(56,189,248,0.15)" />
    <text x="79" y="52" class="font-base" font-size="20">📁</text>
    <text x="90" y="95" text-anchor="middle" class="font-base node-title">1. Entrada &amp; Cola</text>
    <text x="90" y="120" text-anchor="middle" class="font-base node-desc">Imágenes JPG/PNG/WebP</text>
    <text x="90" y="136" text-anchor="middle" class="font-base node-desc">Cola secuencial FIFO</text>
    <text x="90" y="152" text-anchor="middle" class="font-base node-desc">Control de cancelación</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <g transform="translate(230, 165)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#6366f1" stroke-width="3" stroke-dasharray="4 3" />
    <polygon points="35,-5 45,0 35,5" fill="#6366f1" />
  </g>

  <!-- Step 2: Web Worker & WASM ONNX Engine -->
  <g transform="translate(285, 75)" filter="url(#fShadow)">
    <rect width="210" height="200" rx="12" fill="url(#boxGrad)" stroke="#818cf8" stroke-width="2" />
    <rect x="25" y="-10" width="160" height="22" rx="11" fill="url(#purpleGrad2)" />
    <text x="105" y="5" text-anchor="middle" class="font-base" font-size="10" font-weight="800" fill="#ffffff">MOTOR DE IA LOCAL</text>
    <circle cx="105" cy="55" r="24" fill="rgba(99,102,241,0.2)" />
    <text x="94" y="62" class="font-base" font-size="20">🧠</text>
    <text x="105" y="105" text-anchor="middle" class="font-base node-title">2. Inferencia WASM</text>
    <text x="105" y="128" text-anchor="middle" class="font-base node-desc">Web Workers independientes</text>
    <text x="105" y="144" text-anchor="middle" class="font-base node-desc">ONNX Runtime WebAssembly</text>
    <text x="105" y="160" text-anchor="middle" class="font-base node-desc">Modelo RMBG-1.4 / Bria AI</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <g transform="translate(505, 165)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#818cf8" stroke-width="3" stroke-dasharray="4 3" />
    <polygon points="35,-5 45,0 35,5" fill="#818cf8" />
  </g>

  <!-- Step 3: Canvas GPU Pipeline & Effects -->
  <g transform="translate(550, 85)" filter="url(#fShadow)">
    <rect width="190" height="180" rx="12" fill="url(#boxGrad)" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="95" cy="45" r="24" fill="rgba(168,85,247,0.15)" />
    <text x="84" y="52" class="font-base" font-size="20">🎨</text>
    <text x="95" y="95" text-anchor="middle" class="font-base node-title">3. Canvas Pipeline</text>
    <text x="95" y="120" text-anchor="middle" class="font-base node-desc">Filtros: Brillo / Contraste</text>
    <text x="95" y="136" text-anchor="middle" class="font-base node-desc">Sombra 3D y Sticker Border</text>
    <text x="95" y="152" text-anchor="middle" class="font-base node-desc">Aspect Ratios &amp; Fondos</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <g transform="translate(750, 165)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#10b981" stroke-width="3" stroke-dasharray="4 3" />
    <polygon points="35,-5 45,0 35,5" fill="#10b981" />
  </g>

  <!-- Step 4: Export Engine -->
  <g transform="translate(795, 85)" filter="url(#fShadow)">
    <rect width="165" height="180" rx="12" fill="url(#boxGrad)" stroke="#10b981" stroke-width="1.5" />
    <circle cx="82" cy="45" r="24" fill="rgba(16,185,129,0.15)" />
    <text x="71" y="52" class="font-base" font-size="20">📦</text>
    <text x="82" y="95" text-anchor="middle" class="font-base node-title">4. Salida Local</text>
    <text x="82" y="120" text-anchor="middle" class="font-base node-desc">PNG Transparente / JPG</text>
    <text x="82" y="136" text-anchor="middle" class="font-base node-desc">Descarga individual o ZIP</text>
    <text x="82" y="152" text-anchor="middle" class="font-base node-desc">Portapapeles &amp; Historial</text>
  </g>
</svg>
