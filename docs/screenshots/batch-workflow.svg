<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <linearGradient id="batchBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <pattern id="chkp" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#1e293b" />
      <rect width="6" height="6" fill="#334155" />
      <rect x="6" y="6" width="6" height="6" fill="#334155" />
    </pattern>
  </defs>

  <style>
    .font-base { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>

  <rect width="1000" height="500" fill="url(#batchBg)" />

  <!-- Container Box -->
  <g transform="translate(40, 30)" filter="url(#shadow)">
    <rect width="920" height="440" rx="16" fill="#131b2e" stroke="#1f2937" stroke-width="1.5" />

    <!-- Header Area -->
    <g transform="translate(30, 25)">
      <text x="0" y="20" class="font-base" font-size="20" font-weight="800" fill="#ffffff">⚡ Procesamiento por Lotes &amp; Exportación ZIP</text>
      <text x="0" y="42" class="font-base" font-size="13" fill="#94a3b8">Sube múltiples imágenes en simultáneo. El motor procesa en segundo plano sin congelar la interfaz.</text>

      <!-- Action buttons on top right -->
      <g transform="translate(680, 0)">
        <rect width="180" height="42" rx="10" fill="url(#emeraldGrad)" />
        <text x="24" y="26" class="font-base" font-size="13" font-weight="700" fill="#ffffff">📦 Descargar Lote (.ZIP)</text>
      </g>
    </g>

    <!-- Global Progress Bar Box -->
    <g transform="translate(30, 95)">
      <rect width="860" height="60" rx="10" fill="#1a233b" stroke="#334155" stroke-width="1" />
      
      <g transform="translate(20, 16)">
        <text x="0" y="14" class="font-base" font-size="13" font-weight="700" fill="#f8fafc">Progreso Total: 4 de 4 procesadas</text>
        <text x="740" y="14" class="font-base" font-size="13" font-weight="800" fill="#10b981">100%</text>

        <!-- Progress bar track -->
        <rect x="0" y="24" width="820" height="8" rx="4" fill="#0f172a" />
        <rect x="0" y="24" width="820" height="8" rx="4" fill="url(#emeraldGrad)" />
      </g>
    </g>

    <!-- Batch Queue Cards Grid -->
    <g transform="translate(30, 180)">
      
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="200" height="230" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="2" />
        <!-- Preview image -->
        <rect x="15" y="15" width="170" height="120" rx="8" fill="url(#chkp)" />
        <circle cx="100" cy="75" r="30" fill="#818cf8" />
        <text x="15" y="155" class="font-base" font-size="13" font-weight="700" fill="#f8fafc">retrato_modelo.png</text>
        <text x="15" y="172" class="font-base" font-size="11" fill="#94a3b8">1920×1080 • 1.8 MB</text>
        <!-- Status badge -->
        <rect x="15" y="188" width="100" height="24" rx="6" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1" />
        <text x="25" y="204" class="font-base" font-size="11" font-weight="700" fill="#34d399">✓ Completado</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(220, 0)">
        <rect width="200" height="230" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <rect x="15" y="15" width="170" height="120" rx="8" fill="url(#chkp)" />
        <rect x="70" y="45" width="60" height="60" rx="10" fill="#f472b6" />
        <text x="15" y="155" class="font-base" font-size="13" font-weight="700" fill="#f8fafc">producto_ecommerce.jpg</text>
        <text x="15" y="172" class="font-base" font-size="11" fill="#94a3b8">1200×1200 • 950 KB</text>
        <rect x="15" y="188" width="100" height="24" rx="6" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1" />
        <text x="25" y="204" class="font-base" font-size="11" font-weight="700" fill="#34d399">✓ Completado</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(440, 0)">
        <rect width="200" height="230" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <rect x="15" y="15" width="170" height="120" rx="8" fill="url(#chkp)" />
        <polygon points="100,45 135,105 65,105" fill="#38bdf8" />
        <text x="15" y="155" class="font-base" font-size="13" font-weight="700" fill="#f8fafc">vehiculo_auto.png</text>
        <text x="15" y="172" class="font-base" font-size="11" fill="#94a3b8">2048×1536 • 2.4 MB</text>
        <rect x="15" y="188" width="100" height="24" rx="6" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1" />
        <text x="25" y="204" class="font-base" font-size="11" font-weight="700" fill="#34d399">✓ Completado</text>
      </g>

      <!-- Card 4 (Add new / Drop zone) -->
      <g transform="translate(660, 0)">
        <rect width="200" height="230" rx="12" fill="#141d33" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6 5" />
        <circle cx="100" cy="80" r="28" fill="rgba(99,102,241,0.15)" />
        <text x="91" y="88" class="font-base" font-size="28" fill="#818cf8" font-weight="300">+</text>
        <text x="50" y="135" class="font-base" font-size="13" font-weight="700" fill="#c7d2fe">Añadir Imágenes</text>
        <text x="40" y="155" class="font-base" font-size="11" fill="#94a3b8">Arrastra o haz clic aquí</text>
        <text x="35" y="195" class="font-base" font-size="10" fill="#64748b">PNG, JPG, WebP hasta 25MB</text>
      </g>

    </g>
  </g>
</svg>
